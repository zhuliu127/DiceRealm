org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------
# 本机出网只允许走本地代理（Clash / 沙箱代理）。
# Gradle **不读** HTTP_PROXY 环境变量，只认 systemProp.*，不配就会在
# 依赖解析阶段静默挂死（表现：卡在 Running Gradle task 'assembleDebug'）。
# 国内镜像同样要经过这条代理（直连被拦），故 nonProxyHosts 只放本地。
# ---------------------------------------------------------------
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=9194
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=9194
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
